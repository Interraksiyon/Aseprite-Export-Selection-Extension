name: Feature request
description: Suggest an improvement to the extension.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What would this help you do?
      description: Describe the workflow or problem you want to improve.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested behavior
    validations:
      required: true
