name: Bug report
description: Report a problem with installation or exporting.
title: "[Bug]: "
body:
  - type: input
    id: version
    attributes:
      label: Extension version
      placeholder: "1.1.0"
    validations:
      required: true
  - type: input
    id: aseprite
    attributes:
      label: Aseprite version
      placeholder: "1.3.18.6"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the selection type and export format if relevant.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Error message or test report
      render: text
